[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hate-speech-neutralizer"
version = "1.0.0"
description = "Neural Toxicity Detection and Text Neutralization Workspace"
authors = [{ name = "Ayush Sawant & Collaborators" }]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "tensorflow>=2.15.0",
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "accelerate>=0.25.0",
    "sentencepiece>=0.1.99",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "streamlit>=1.30.0",
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

